name: Bug report
description: Something produced a wrong result, crashed, or failed to run.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Every default workflow here is offline and deterministic, so a bug is
        usually reproducible from the command alone. The run notes in
        `discovery-report.md` say which adapters were unavailable — please
        include them.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command
      render: shell
      placeholder: swift run BioLabExplorerPipeline --input query.fasta --output runs/demo
    validations:
      required: true
  - type: textarea
    id: host
    attributes:
      label: Host profile
      description: Output of `python3 scripts/host_profile.py`
      render: json
    validations:
      required: true
  - type: input
    id: swift
    attributes:
      label: Swift version
      placeholder: swift --version
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Run notes
      description: The "Run Notes" section of discovery-report.md, if a run completed.
      render: text
