name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, check and run the offline suite
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Report toolchain
        run: |
          swift --version
          python3 --version
          sw_vers

      - name: Cache SwiftPM build products
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Sources/**/*.swift') }}
          restore-keys: ${{ runner.os }}-spm-

      # HMMER lets the Pfam adapter test build a throwaway profile database and
      # exercise the real hmmscan chain. Without it that test skips itself.
      - name: Install HMMER
        env:
          HOMEBREW_NO_ENV_HINTS: "1"
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          # The runner image ships an untrusted aws/tap, and Homebrew annotates
          # every run about it. Nothing here needs that tap.
          brew untap aws/tap 2>/dev/null || true
          brew install hmmer

      # The entry point the README tells a newcomer to run. If this breaks,
      # the first thing anyone does with the project breaks.
      - name: Machine check (scripts/doctor.sh)
        run: bash scripts/doctor.sh

      - name: Build (debug)
        run: swift build

      - name: Swift checks
        run: swift run BioLabExplorerChecks

      - name: Build (release)
        run: swift build -c release

      # Everything below runs offline: no test contacts UniProt, AlphaFold,
      # Pfam or any model host.
      - name: Offline test suite (M1..M5 + adapters)
        run: |
          set -o pipefail
          bash Tests/perpetual/run_all.sh | tee suite.log

      - name: Host profile on this runner
        run: python3 scripts/host_profile.py --config config/worker.json --explain

      # Names the optional-tool suites that skipped on this runner, so a silent
      # skip is never mistaken for a pass. OpenMM is not installed here, so its
      # determinism suite is expected to skip.
      - name: Report skipped suites
        if: always()
        run: grep -i "SKIPPED" suite.log || echo "no suite skipped"

      - name: Package the app bundle
        run: scripts/package_app.sh

  static-checks:
    name: Shell and Python static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Shell syntax
        run: |
          status=0
          for script in $(git ls-files '*.sh'); do
            bash -n "$script" || status=1
          done
          exit $status

      - name: ShellCheck
        # SC1091: sourced files are resolved at runtime, not in CI.
        run: shellcheck --severity=warning --exclude=SC1091 $(git ls-files '*.sh')

      - name: Python syntax
        run: python3 -m compileall -q scripts Tests

      - name: Host profile unit tests (non-macOS host)
        run: python3 Tests/perpetual/test_host_profile.py

      - name: Worker config contract
        run: bash Tests/perpetual/test_config.sh
