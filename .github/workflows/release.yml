name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach artifacts to
        required: true

permissions:
  contents: write
  # Build provenance: signed, public evidence that these exact bytes came out
  # of this workflow, from this commit. It is not Apple notarization — nothing
  # here makes Gatekeeper happy — but it is the part notarization would have
  # given a reader that can be had without a paid certificate.
  id-token: write
  attestations: write

jobs:
  artifacts:
    name: Build and attach the downloads
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Report toolchain
        run: swift --version

      # A release must not ship something the test suite has not seen.
      - name: Swift checks
        run: swift run BioLabExplorerChecks

      - name: Build the downloads
        run: scripts/package_release.sh

      - name: The version must match the tag
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="$(sed -n 's/.*static let current = "\(.*\)".*/\1/p' Sources/BioLabExplorerCore/Version.swift)"
          if [ "${tag}" != "v${version}" ]; then
            echo "tag ${tag} does not match BioLabExplorerVersion ${version}" >&2
            exit 1
          fi
          echo "tag ${tag} matches version ${version}"

      # Proves the artifact actually starts, on the runner, before anyone
      # downloads it.
      - name: Smoke-test the packaged binary
        run: |
          mkdir -p /tmp/smoke
          tar -xzf dist/release/*.tar.gz -C /tmp/smoke
          "$(find /tmp/smoke -name BioLabExplorerPipeline -type f | head -1)" --version

      - name: Attest what was built
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/release/*.tar.gz
            dist/release/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-downloads
          path: dist/release/*

      # Release notes come from the CHANGELOG section for this version, so the
      # page a downloader lands on says what changed rather than listing commit
      # subjects.
      - name: Extract the release notes
        run: |
          version="$(sed -n 's/.*static let current = "\(.*\)".*/\1/p' Sources/BioLabExplorerCore/Version.swift)"
          awk -v v="## [${version}]" '
            index($0, v) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "no CHANGELOG section for ${version}" >&2
            exit 1
          fi
          head -5 release-notes.md

      # Pushing a tag creates a tag, not a release: `gh release upload` has
      # nothing to attach to on a first publish. Create it when it is missing,
      # upload into it when a previous run already made it.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          repo="${{ github.repository }}"
          if gh release view "${tag}" --repo "${repo}" > /dev/null 2>&1; then
            echo "release ${tag} exists; attaching artifacts"
            gh release upload "${tag}" dist/release/* --clobber --repo "${repo}"
            gh release edit "${tag}" --repo "${repo}" --notes-file release-notes.md
          else
            echo "creating release ${tag}"
            gh release create "${tag}" dist/release/* \
              --repo "${repo}" \
              --title "${tag}" \
              --notes-file release-notes.md \
              --verify-tag
          fi
          gh release view "${tag}" --repo "${repo}" --json assets \
            --jq '"attached: " + ([.assets[].name] | join(", "))'
